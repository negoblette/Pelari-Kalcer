<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#1e3bff" style="background:#1e3bff;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center" style="padding:32px 16px 36px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr>
          <td style="padding:0 4px 24px;color:#f4f1e8;font-family:Impact,'HelveticaNeue-CondensedBlack','Arial Black',Arial,sans-serif;font-size:20px;font-weight:normal;letter-spacing:1px;text-transform:uppercase;">
            Pelari Kalcer
          </td>
        </tr>
        <tr>
          <td style="padding:0 4px 24px;font-family:Impact,'HelveticaNeue-CondensedBlack','Arial Black',Arial,sans-serif;font-size:52px;line-height:50px;font-weight:normal;text-transform:uppercase;">
            <span style="color:#f4f1e8;">Sign-in</span><br>
            <span style="color:#ffd400;">Code.</span>
          </td>
        </tr>
        <tr>
          <td bgcolor="#f4f1e8" style="background:#f4f1e8;border-radius:6px;overflow:hidden;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td bgcolor="#ff5a1f" style="background:#ff5a1f;border-radius:6px 6px 0 0;padding:11px 20px;color:#15161a;font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;">
                  Verification bib
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:30px 12px 8px;color:#15161a;font-family:Impact,'HelveticaNeue-CondensedBlack','Arial Black',Arial,sans-serif;font-size:46px;line-height:50px;font-weight:normal;letter-spacing:3px;">
                  {{ .Token }}
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 24px 26px;color:#1e3bff;font-family:Impact,'HelveticaNeue-CondensedBlack','Arial Black',Arial,sans-serif;font-size:18px;font-weight:normal;letter-spacing:1px;text-transform:uppercase;">
                  Kode verifikasi kamu
                </td>
              </tr>
              <tr>
                <td style="padding:0 24px 24px;">
                  <p style="margin:0;border-top:3px solid #15161a;padding-top:14px;color:#15161a;font-size:15px;line-height:23px;">
                    Masukkan kode ini di aplikasi Pelari Kalcer untuk melanjutkan.
                  </p>
                </td>
              </tr>
              <tr>
                <td style="border-top:2px dashed #15161a;padding:13px 24px;color:#15161a;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:18px;">
                  Sekali pakai. Jangan bagikan kode ini kepada siapa pun.
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 4px 0;color:#f4f1e8;font-size:13px;line-height:20px;">
            Tidak merasa meminta kode ini? Abaikan email ini. Akunmu tetap aman.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
